[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "havnvard-bitrot"
version = "1.1.0"
description = "INFRA-126 scheduled periodic re-hashing, divergence detection, and assurance SLA control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1,<4"]

[project.optional-dependencies]
web = ["flask>=3,<4"]
test = ["pytest>=8"]

[project.scripts]
havnvard-bitrot = "havnvard_bitrot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
